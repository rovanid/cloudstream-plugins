# ============================================================
# KANDIDAT DOMAIN CADANGAN untuk deteksi otomatis
# Format:  NamaFolder: kata_kunci | https://kandidat1 | https://kandidat2
#
# kata_kunci = teks yang PASTI ada di halaman situs asli (misal nama situs).
#              Dipakai supaya domain parkir/iklan tidak ikut terpilih.
# kandidat   = domain lain yang mungkin dipakai situs tsb. Opsional,
#              boleh dikosongkan (hanya kata kunci).
#
# Urutan kerja script:
#   1. Cek domain di domains.yml. Kalau redirect ke domain baru -> pakai itu.
#   2. Kalau mati/tidak valid -> coba kandidat berurutan.
#   3. Kalau semua gagal -> domains.yml tidak diubah.
# ============================================================

AnimeSailProvider: animesail | https://anisail.com/
KuramanimeProvider: kuramanime | https://v20.kuramanime.ing/
OtakudesuProvider: otakudesu | https://otakudesu.blog/
