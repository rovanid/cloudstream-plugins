name: Cek PR

on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Registry dan tes
        run: |
          python3 .github/scripts/registry.py
          python3 -m unittest discover -s tests -v
