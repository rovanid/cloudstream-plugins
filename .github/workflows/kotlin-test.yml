name: Tes parser Kotlin

# Terpisah dari build.yml: TIDAK menyentuh branch builds maupun main.
# Jalan manual (Actions -> Tes parser Kotlin -> Run workflow, pilih branch) atau saat push
# ke branch `test/...`. Proyek tesnya ada di tests/kotlin (JVM murni, tanpa Android SDK).

on:
  workflow_dispatch:
  push:
    branches: ["test/**"]

permissions:
  contents: read

concurrency:
  group: kotlin-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Tes Python (ringkasan JUnit ikut diuji)
        run: |
          pip install beautifulsoup4
          python3 -m unittest discover -s tests -v

      - name: Jalankan tes Kotlin
        id: kt
        continue-on-error: true
        run: gradle -p tests/kotlin test --no-daemon --console=plain

      - name: Ringkasan (terbaca di HP)
        if: always()
        run: python3 .github/scripts/summarize_junit.py tests/kotlin/build/test-results >> "$GITHUB_STEP_SUMMARY"

      - name: Simpan laporan
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: laporan-tes
          path: tests/kotlin/build/reports/tests
          if-no-files-found: ignore

      - name: Gagal bila tes gagal
        if: steps.kt.outcome == 'failure'
        run: exit 1
